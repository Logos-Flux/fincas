# Publish the `fincas` distribution to PyPI from a release tag, by trusted
# publishing (OIDC): no API token anywhere (docs/release-process.md §3.8).
#
# Runs only in the public repository: PyPI's pending publisher is registered
# for Logos-Flux/fincas + this workflow + the environments below, so the same
# file in the private dev repo is inert (every job is skipped). Order: build
# from the tag → TestPyPI → journey R12 on the TestPyPI upload (a fresh venv,
# docs/getting-started.md to a first invoice) → PyPI, which also waits for
# the `pypi` environment's required reviewer.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.4.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    if: github.repository == 'Logos-Flux/fincas'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: The ref is a release tag
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::publish builds release tags only (v*), got '$TAG'"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --quiet build twine packaging
          python -m build
          python -m twine check --strict dist/*
      # PEP 440 comparison, so a tag v0.4.1-rc.1 matches version 0.4.1rc1.
      - name: The tag and the package version agree
        id: version
        run: |
          python - <<'EOF'
          import os, tomllib
          from packaging.version import Version
          tag = os.environ["TAG"].removeprefix("v")
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if Version(tag) != Version(ver):
              raise SystemExit(f"::error::tag v{tag} but pyproject.toml says {ver}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={Version(ver)}\n")
          EOF
      - name: The wheel installs alone and imports
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import golden_erp; print('golden_erp', golden_erp.__version__)"
      - name: Record the digests for the release notes
        run: sha256sum dist/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Upload to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fincas
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # §3.8 step 3, automated: install what TestPyPI now serves into a fresh venv
  # and follow docs/getting-started.md to a first invoice (journey R12).
  testpypi-install:
    name: R12 on the TestPyPI upload
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info fonts-dejavu-core curl
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install Playwright and Chromium
        working-directory: storefront
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      # A new upload takes a few minutes to appear in the simple index.
      - name: Wait for fincas==${{ env.VERSION }} on TestPyPI
        run: |
          for _ in $(seq 1 40); do
            python -m pip download --quiet --no-deps --dest /tmp/probe \
              --only-binary :all: --index-url https://test.pypi.org/simple/ "fincas==$VERSION" && exit 0
            sleep 15
          done
          echo "::error::fincas==$VERSION did not appear on TestPyPI within 10 minutes"; exit 1
      # R12 must test the very wheel the pypi job uploads. A re-run for the
      # same version rebuilds (wheels are not byte-reproducible) while
      # TestPyPI keeps its first upload (skip-existing), so compare digests.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: The TestPyPI wheel is this run's wheel
        run: |
          served=$(sha256sum /tmp/probe/fincas-*.whl | cut -d' ' -f1)
          built=$(sha256sum dist/fincas-*.whl | cut -d' ' -f1)
          echo "TestPyPI: $served · this run: $built"
          if [[ "$served" != "$built" ]]; then
            echo "::error::TestPyPI serves a different fincas==$VERSION wheel than this run built (an earlier upload). Bump the version or delete the TestPyPI release; PyPI is not uploaded."
            exit 1
          fi
      # The wheel TestPyPI serves, installed with its dependencies from PyPI
      # only: mixing the two indexes for dependencies would let a squatted
      # name on TestPyPI win.
      - name: docs/getting-started.md on the TestPyPI wheel
        run: |
          wheel=$(ls /tmp/probe/fincas-*.whl)
          echo "TestPyPI served $(basename "$wheel"): $(sha256sum "$wheel" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          bash scripts/release/r12_fresh_install.sh --python python --pip-spec "$wheel"

  pypi:
    name: Upload to PyPI
    needs: testpypi-install
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fincas
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
