# Repo-level gitleaks config: extend the default rules and allow-list the
# recorded/invented fixture trees. Everything under these paths is test data
# by policy (see docs/crm/phase5-importer.md §5 and docs/crm/phase6-adapters.md
# "fixture strategy"): invented tokens, example.com addresses, 555-01xx numbers.
# A real credential must never be committed there either; the tripwire and
# the no-network test guard keep fixtures from reaching a live service.
[extend]
useDefault = true

#
# Vendored third-party JavaScript (minified bundles shipped as-is) is also
# allow-listed: identifiers such as Quill's `SHORTKEY` trip `generic-api-key`.
# Dev CI scans only each PR's new commits, so these files were never rescanned;
# the public repository's first CI run scans its one squashed commit whole and
# flagged them (2026-11-03). .gitleaksignore cannot cover that: a fingerprint
# names the commit, and the public commit's sha is new.
[allowlist]
description = "Invented fixture data and vendored third-party JavaScript"
paths = [
  '''^golden_erp/addons/[^/]+/fixtures/.*''',
  '''^crm_import/tests/fixtures/.*''',
  '''^golden_erp/static/assets/js/plugins/.*''',
]
