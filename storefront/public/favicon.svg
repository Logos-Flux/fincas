<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="goldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="goldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="goldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" rx="28" fill="#090A0F"/>
  <circle cx="60" cy="60" r="50" fill="url(#goldGlow)"/>

  <!-- Upper Arch -->
  <path d="M 60 18 L 94 37 L 77 47 L 60 37 L 43 47 L 26 37 Z" fill="url(#goldTop)" stroke="#FEF9C3" stroke-width="1" stroke-linejoin="round"/>
  <!-- Left Outer Wall -->
  <path d="M 26 37 L 43 47 L 43 75 L 26 85 Z" fill="url(#goldLeft)" stroke="#FCD34D" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Bottom Arch -->
  <path d="M 26 85 L 43 75 L 60 85 L 77 75 L 94 85 L 60 103 Z" fill="url(#goldRight)" stroke="#B45309" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Right Lower Wall & Inner Crossbar -->
  <path d="M 94 85 L 77 75 L 77 60 L 94 50 Z" fill="url(#goldLeft)" stroke="#F59E0B" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- G Shelf -->
  <path d="M 60 50 L 94 50 L 77 60 L 60 60 Z" fill="url(#goldTop)" stroke="#FEF9C3" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Center Core -->
  <polygon points="60,42 69,47 60,53 51,47" fill="url(#goldCore)" stroke="#FEF08A" stroke-width="0.6"/>
</svg>
