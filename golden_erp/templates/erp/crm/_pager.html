{% if is_paginated %}
<div class="card-footer d-flex justify-content-between align-items-center flex-wrap gap-2">
  <p class="text-sm text-secondary mb-0">Showing {{ page_obj.start_index }}-{{ page_obj.end_index }} of {{ paginator.count }}</p>
  <nav aria-label="Pages">
    <ul class="pagination pagination-sm mb-0">
      {% if page_obj.has_previous %}
      <li class="page-item"><a class="page-link" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" aria-label="Previous page"><i class="fas fa-angle-left" aria-hidden="true"></i></a></li>
      {% endif %}
      <li class="page-item active"><span class="page-link">{{ page_obj.number }}</span></li>
      {% if page_obj.has_next %}
      <li class="page-item"><a class="page-link" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}" aria-label="Next page"><i class="fas fa-angle-right" aria-hidden="true"></i></a></li>
      {% endif %}
    </ul>
  </nav>
</div>
{% endif %}
