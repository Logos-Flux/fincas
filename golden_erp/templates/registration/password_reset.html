{% extends "registration/auth_base.html" %}

{% block title %}Reset Password{% endblock %}

{% block card %}
  <div class="login-card-title">Reset Passphrase</div>
  <p class="login-lede">Enter your email address and we'll send you a link to reset your password.</p>

  <form method="post" action="{% url 'erp-password-reset' %}">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label" for="id_email">Email address</label>
      <input type="email" name="email" id="id_email" class="form-input"
             placeholder="operator@example.com" autocomplete="email" autofocus required>
    </div>
    <button type="submit" class="btn-login">Send reset link</button>
  </form>
{% endblock %}

{% block footer %}
  <div class="login-footer">
    <a href="{% url 'erp-login' %}">Back to sign in</a>
  </div>
{% endblock %}
