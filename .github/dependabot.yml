version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/requirements"]   # pyproject.toml and requirements/*.txt
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: bun
    directory: "/storefront"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      storefront-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
