{# The Stage-import form, shared by the Imports list and the upload page. #}
        <form method="post" action="{% url 'erp-unify-batch-upload' %}" enctype="multipart/form-data" class="row g-2 align-items-end mb-4">
          {% csrf_token %}
          <div class="col-md-4">
            <label class="form-label text-xs" for="id_source_name">Source name</label>
            <input type="text" name="source_name" id="id_source_name" required maxlength="255"
              class="form-control form-control-sm" placeholder="shopify-products-2026-10.csv">
          </div>
          <div class="col-md-4">
            <label class="form-label text-xs" for="id_csv_file">CSV file (UTF-8)</label>
            <input type="file" name="csv_file" id="id_csv_file" required accept=".csv" class="form-control form-control-sm">
          </div>
          <div class="col-auto">
            <button type="submit" class="btn bg-gradient-primary btn-sm mb-0">Stage import</button>
          </div>
        </form>
